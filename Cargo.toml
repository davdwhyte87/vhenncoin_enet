[package]
name = "vhenncoin_enet"
version = "0.1.0"
edition = "2021"
description = "VhennCoin ENET - a hash-linked blockchain node"
license = "MIT"

[[bin]]
name = "vhenncoin_enet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

redb = "2"

tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
log = "0.4"

sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
