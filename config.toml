# VhennCoin ENET node configuration

[node]
name = "vhenncoin-enet-node"
chain_id = 4242
data_dir = "./data"

[api]
listen_addr = "127.0.0.1:8545"
enable_cors = true

[network]
listen_addr = "0.0.0.0:7000"
# Pair / boot nodes to dial on start-up, as "host:port" or "ip:port".
# A node syncs (downloads + validates) the chain from whichever peer reports a
# higher finalised height.
bootnodes = []
max_peers = 32
# Number of blocks requested per batch while syncing.
sync_batch_size = 32

[storage]
path = "./data/vhenncoin.redb"

[consensus]
kind = "validator-set"
block_time_secs = 5
# Version stamped into blocks produced under this validator set.
validator_set_version = 1
# Hex-encoded public keys of the genesis validators. They are seeded as
# approved at bootstrap and seal blocks in a deterministic round-robin: the
# proposer for a height is `sorted_validator_addresses[height % count]`, and a
# block is only valid if that proposer signed it. Leave empty to run a
# genesis-only node.
validators = []

# Permissioning rules. These are consensus-critical: they are written into the
# genesis state on first bootstrap and never re-read from this file afterwards.
[governance]
# Fraction of eligible validators that must approve a new node, in basis points
# (9000 = 90%).
approval_threshold_bps = 9000
# Fraction that must reject a node, in basis points. A rejected node is removed
# and its stake is paid back to the wallet that funded it.
rejection_threshold_bps = 9000
# Blocks a pending proposal stays open before it is auto-rejected and refunded.
# 0 disables automatic expiry.
voting_period_blocks = 0
# Hex-encoded public keys allowed to unilaterally remove a node by broadcasting
# a signed removal transaction. Any single key is sufficient. Genesis validators
# cannot be removed this way.
override_keys = []

[crypto]
signature_scheme = "secp256k1"

[genesis]
# Hex-encoded SEC1 public key (compressed or uncompressed) that receives the
# initial 80,000,000 VHN supply. Only used the first time the chain is
# bootstrapped; after that the stored genesis block is authoritative.
# Leave empty to fall back to the deterministic treasury recipient.
public_key = ""
