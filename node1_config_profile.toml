# Node 1 config
[node]
name = "node1"
chain_id = 4242
data_dir = "./data_node1"
keystore_path = "./profiles/node1.keystore.txt"
public_key = "03674c909d74cd2ec2f98c4dc9409a448c0d9c80f36738cc990cff3fbb1bc0783e"
stake_address = "035faa6076e476a6cc2cb5bf0428d27baf76894b77ca3b82bb54a679ca149437f2"

[api]
listen_addr = "127.0.0.1:8545"
enable_cors = true

[network]
listen_addr = "127.0.0.1:7000"
bootnodes = []
max_peers = 32
sync_batch_size = 32

[storage]
path = "./data_node1/vhenncoin.redb"

[consensus]
kind = "validator-set"
block_time_secs = 5
validator_set_version = 1
validators = ["03b485e80a6b56c1ba238d9f8907e7b300ad348ccdedbfbcef45eaae44f70a2724"]
validator_private_keys = ["7face9f3b888f31f6bf370edcb6c00a4c4c60dabb89ee7f86e3ce5f1d8b1ba67"]

# Permissioning rules. Written into genesis on first bootstrap and then read
# only from chain state, never from this file.
[governance]
approval_threshold_bps = 9000
rejection_threshold_bps = 9000
voting_period_blocks = 0
# Hex-encoded public keys allowed to unilaterally remove a node (any one wins).
override_keys = []

[crypto]
signature_scheme = "secp256k1"

[genesis]
public_key = "03b485e80a6b56c1ba238d9f8907e7b300ad348ccdedbfbcef45eaae44f70a2724"
